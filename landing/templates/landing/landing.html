{% load static %}

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thiên Vấn</title>
    <link rel="stylesheet" href="{% static 'landing/css/landing.css' %}">
</head>
<body>
    <main class="landing-page video-theme-1" data-active-video="1">
        <video class="landing-video is-active" data-video-index="1" autoplay muted playsinline preload="auto" aria-hidden="true">
            <source src="{% static 'landing/video/video1.mp4' %}" type="video/mp4">
        </video>
        <video class="landing-video" data-video-index="2" muted playsinline preload="auto" aria-hidden="true">
            <source src="{% static 'landing/video/video2.mp4' %}" type="video/mp4">
        </video>
        <div class="video-wash" aria-hidden="true"></div>

        <canvas class="three-canvas" id="threeCanvas" aria-hidden="true"></canvas>
        <canvas class="aura-canvas" id="auraCanvas" aria-hidden="true"></canvas>

        <div class="celestial-depth" aria-hidden="true">
            <div class="mist mist-a"></div>
            <div class="mist mist-b"></div>
            <div class="mountain mountain-a"></div>
            <div class="mountain mountain-b"></div>
            <div class="spirit-ring ring-a"></div>
            <div class="spirit-ring ring-b"></div>
            <div class="floating-sword"></div>
            <div class="jade-orbit">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>

        <section class="hero">
            <h1>Thiên Vấn</h1>
            <p class="hero-copy">
                Linh pháp khai môn, thiên vấn tri kiến, tinh hà chiếu giám, phù vân nhập cảnh.
            </p>
            <a class="enter-chat" href="{{ chat_url }}" data-transition-link>
                <span>Vấn Đạo</span>
                {% comment %} <i aria-hidden="true"></i> {% endcomment %}
            </a>
        </section>

        <div class="lotus-platform" aria-hidden="true">
            <div class="lotus-core"></div>
            <div class="lotus-petal petal-a"></div>
            <div class="lotus-petal petal-b"></div>
            <div class="lotus-petal petal-c"></div>
        </div>

        <div class="portal-transition" id="portalTransition" aria-hidden="true">
            <div class="portal-ring outer"></div>
            <div class="portal-ring middle"></div>
            <div class="portal-ring inner"></div>
            <div class="portal-flare"></div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="{% static 'landing/js/landing.js' %}"></script>
</body>
</html>
