chunking:
  chunk_size: 1000
  chunk_overlap: 100
retriever:
  score_threshold: 0.5
chat_history:
  num_chats_retained: 5
  max_length: 2048
  beam_size: 15
splitter:
  method: sentence_transformer # Options: recursive_character, tiktoken, sentence_transformer
embedding:
  embedding_provider: ollama
  embedding_model: qwen3-embedding
  dimension: 4096
loader:
  type: jsonl