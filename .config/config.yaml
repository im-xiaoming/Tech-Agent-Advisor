chunking:
  chunk_size: 1024
  chunk_overlap: 124
retriever:
  score_threshold: 0.0
  hybrid_enabled: true   # bật để dùng dense + BM25 sparse (cần rebuild index)
  sparse_model: Qdrant/bm25
  self_query_enabled: true # cho LLM extract filter (price/ram/brand…) từ câu hỏi
reranker:
  enabled: true
  model: Alibaba-NLP/gte-multilingual-reranker-base
  top_n: 5
  candidate_multiplier: 5
  hallucination_threshold: 0.5
  min_rerank_score: 0.0
  regenerate_enabled: true     # tự sinh lại câu trả lời nếu groundedness/citation thấp
  regenerate_threshold: 0.4    # ngưỡng groundedness để kích hoạt regenerate
  max_regenerations: 1         # tối đa số lần regenerate mỗi lượt
chat_history:
  num_chats_retained: 5
  max_length: 3072
  beam_size: 20
splitter:
  method: sentence_transformer # Options: recursive_character, tiktoken, sentence_transformer
embedding:
  embedding_provider: openai  # ollama, huggingface, openai
  embedding_model: text-embedding-3-large # qwen3-embedding BAAI/bge-m3, text-embedding-3-large
  dimension: 3072 # bge-m3=1024, qwen3-embedding=4096 — must match the active embedding_model
  device: auto # auto, cuda, or cpu
  batch_size: 2
  max_seq_length: 512 # use for HuggingFaceEmbeddings
  ingest_batch_size: 8
loader:
  type: jsonl
