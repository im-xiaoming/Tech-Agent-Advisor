chunking:
  chunk_size: 1000
  chunk_overlap: 100
retriever:
  score_threshold: 0.0
reranker:
  enabled: true
  model: Alibaba-NLP/gte-multilingual-reranker-base
  top_n: 5
  candidate_multiplier: 3
  hallucination_threshold: 0.5
  min_rerank_score: 0.0
chat_history:
  num_chats_retained: 5
  max_length: 2048
  beam_size: 15
splitter:
  method: sentence_transformer # Options: recursive_character, tiktoken, sentence_transformer
embedding:
  embedding_provider: huggingface # ollama
  embedding_model: BAAI/bge-m3 # qwen3-embedding
  dimension: 4096
loader:
  type: jsonl