chunking:
  chunk_size: 1024
  chunk_overlap: 124
retriever:
  score_threshold: 0.0
  hybrid_enabled: true
  sparse_model: Qdrant/bm25
  self_query_enabled: true
reranker:
  enabled: true
  model: Alibaba-NLP/gte-multilingual-reranker-base
  top_n: 5
  candidate_multiplier: 3
  hallucination_threshold: 0.5
  min_rerank_score: 0.0
  regenerate_enabled: true
  regenerate_threshold: 0.4
  max_regenerations: 1
chat_history:
  num_chats_retained: 5
  max_length: 3072
  beam_size: 20
splitter:
  method: sentence_transformer
embedding:
  embedding_provider: openai
  embedding_model: text-embedding-3-large
  dimension: 3072
  device: auto
  batch_size: 2
  max_seq_length: 512
  ingest_batch_size: 8
loader:
  type: jsonl
vector:
  backend: qdrant
  collection: tech_products
llm:
  provider: openai
  model: gpt-5-mini
  supervisor_model: gpt-5-mini
semantic_cache:
  enabled: true
  collection: tech_answer_cache
  threshold: 0.8
  ttl_hours: 24
  limit: 5
